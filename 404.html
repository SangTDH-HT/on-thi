<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26301F">
<title>Ôn thi – tạm ngừng để nâng cấp</title>
<style>
  :root { --nen: #26301F; --chu: #ECE6CC; --nhat: #BDB896; --dong: #D9AA3D; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--nen); color: var(--chu);
    font: 17px/1.55 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: grid; place-items: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 26rem; border-top: 3px solid var(--dong); padding-top: 20px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 10px; }
  p { margin: 0; color: var(--nhat); }
</style>
</head>
<body>
<main>
  <h1>App Ôn thi tạm ngừng để nâng cấp</h1>
  <p>App đang được nâng cấp nên tạm thời không dùng được. Bản lưu cũ trong máy này đã được xóa.</p>
</main>
<script>
  /* Xóa mọi thứ app cũ để lại trong máy: mật khẩu, khóa dữ liệu, bản lưu ngoại tuyến */
  try {
    Object.keys(localStorage).filter(function (k) { return k.indexOf('gdqp.') === 0; })
      .forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) { /* trình duyệt chặn bộ nhớ */ }
  if (window.caches) caches.keys().then(function (ds) { ds.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  }
</script>
</body>
</html>
